services:
  9router-go:
    image: ghcr.io/tahsinarafat/9router-go-sleepy:latest
    container_name: 9router-go
    ports:
      - "20130:20130"
    volumes:
      - 9router-data:/data
    environment:
      - PORT=20130
      - DATA_DIR=/data
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
      # Token saver toggles (all default off except RTK):
      # - RTK_ENABLED=true
      # - CAVEMAN_ENABLED=false
      # - PONYTAIL_ENABLED=false
      # Or use DB_PATH for custom SQLite location:
      # - DB_PATH=/data/custom/data.sqlite
    restart: unless-stopped

volumes:
  9router-data:
